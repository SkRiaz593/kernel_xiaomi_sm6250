name: Package RedCherry Kernel

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Build #10 Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p kernel-artifact

          gh run download 34679231301 \
            --repo "$GITHUB_REPOSITORY" \
            --name RedCherry-Kernel \
            --dir kernel-artifact

          find kernel-artifact -type f | sort

      - name: Verify Kernel Files
        run: |
          set -e
          test -f kernel-artifact/arch/arm64/boot/Image.gz
          test -f kernel-artifact/drivers/net/wireless/ath/ath.ko
          test -f kernel-artifact/drivers/net/wireless/ath/ath9k/ath9k_common.ko
          test -f kernel-artifact/drivers/net/wireless/ath/ath9k/ath9k_hw.ko
          test -f kernel-artifact/drivers/net/wireless/ath/ath9k/ath9k_htc.ko

          echo "All RedCherry files verified."

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

      - name: Configure RedCherry AnyKernel
        run: |
          set -e

          cd AnyKernel3

          rm -rf ramdisk patch
          rm -f Image Image.gz Image.gz-dtb README.md

          mkdir -p modules/system/lib/modules

          cp ../kernel-artifact/arch/arm64/boot/Image.gz .

          cp ../kernel-artifact/drivers/net/wireless/ath/ath.ko \
            modules/system/lib/modules/

          cp ../kernel-artifact/drivers/net/wireless/ath/ath9k/ath9k_common.ko \
            modules/system/lib/modules/

          cp ../kernel-artifact/drivers/net/wireless/ath/ath9k/ath9k_hw.ko \
            modules/system/lib/modules/

          cp ../kernel-artifact/drivers/net/wireless/ath/ath9k/ath9k_htc.ko \
            modules/system/lib/modules/

          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## RedCherry Kernel - Xiaomi miatoll / curtana

          properties() { '
          kernel.string=RedCherry Kernel by Riaz
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=curtana
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;

          flash_boot;
          EOF

          echo "=== FINAL ANYKERNEL CONTENT ==="
          find . -type f | sort

      - name: Create Flashable RedCherry ZIP
        run: |
          set -e

          cd AnyKernel3

          zip -r9 \
            ../RedCherry-miatoll-Flashable.zip \
            . \
            -x ".git/*" \
            ".github/*" \
            "LICENSE"

          cd ..

          echo "=== FINAL ZIP ==="
          ls -lh RedCherry-miatoll-Flashable.zip

          echo ""
          echo "=== IMPORTANT ZIP CONTENT ==="
          unzip -l RedCherry-miatoll-Flashable.zip | grep -E \
            "Image.gz|anykernel.sh|META-INF|tools/ak3-core.sh|ath.*\.ko"

      - name: Upload Flashable RedCherry Kernel
        uses: actions/upload-artifact@v4
        with:
          name: RedCherry-miatoll-Flashable
          path: RedCherry-miatoll-Flashable.zip
          if-no-files-found: error
