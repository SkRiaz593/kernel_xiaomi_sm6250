name: Package RedCherry Kernel

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: 16.0

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y unzip zip

      - name: Download Build #11 Artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34691032227
          name: RedCherry-Kernel
          path: kernel-artifact

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            anykernel

          rm -rf anykernel/.git
          rm -rf anykernel/.github

      - name: Copy Kernel Image
        run: |
          cp kernel-artifact/arch/arm64/boot/Image.gz \
            anykernel/Image.gz

      - name: Copy Kernel Modules
        run: |
          mkdir -p anykernel/modules/system/lib/modules

          cp kernel-artifact/drivers/net/wireless/ath/ath.ko \
            anykernel/modules/system/lib/modules/

          cp kernel-artifact/drivers/net/wireless/ath/ath9k/ath9k_common.ko \
            anykernel/modules/system/lib/modules/

          cp kernel-artifact/drivers/net/wireless/ath/ath9k/ath9k_hw.ko \
            anykernel/modules/system/lib/modules/

          cp kernel-artifact/drivers/net/wireless/ath/ath9k/ath9k_htc.ko \
            anykernel/modules/system/lib/modules/

      - name: Configure AnyKernel3
        run: |
          cat > anykernel/anykernel.sh <<'EOF'
          properties() { '
          kernel.string=RedCherry Kernel by Riaz
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=curtana
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

      - name: Verify Package Contents
        run: |
          echo "=== KERNEL ==="
          ls -lh anykernel/Image.gz

          echo ""
          echo "=== ATH9K MODULES ==="
          ls -lh anykernel/modules/system/lib/modules/

          echo ""
          echo "=== ANYKERNEL CONFIG ==="
          cat anykernel/anykernel.sh

      - name: Create Flashable ZIP
        run: |
          cd anykernel

          zip -r9 ../RedCherry-miatoll-Flashable.zip . \
            -x ".git/*" \
            -x ".github/*"

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RedCherry-miatoll-Flashable
          path: RedCherry-miatoll-Flashable.zip
          if-no-files-found: error
