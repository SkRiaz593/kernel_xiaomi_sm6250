name: Package RedCherry Kernel

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Build #10 Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p kernel-artifact

          gh run download 34679231301 \
            --repo "$GITHUB_REPOSITORY" \
            --name RedCherry-Kernel \
            --dir kernel-artifact

          echo "=== DOWNLOADED FILES ==="
          find kernel-artifact -type f -print | sort

      - name: Verify Kernel Files
        run: |
          set -e

          test -f kernel-artifact/Image.gz
          test -f kernel-artifact/ath.ko
          test -f kernel-artifact/ath9k/ath9k_common.ko
          test -f kernel-artifact/ath9k/ath9k_hw.ko
          test -f kernel-artifact/ath9k/ath9k_htc.ko

          echo "=== ALL REQUIRED FILES FOUND ==="

      - name: Prepare Package
        run: |
          set -e

          rm -rf RedCherry-ZIP

          mkdir -p RedCherry-ZIP/modules/system/lib/modules

          cp kernel-artifact/Image.gz \
            RedCherry-ZIP/Image.gz

          cp kernel-artifact/ath.ko \
            RedCherry-ZIP/modules/system/lib/modules/ath.ko

          cp kernel-artifact/ath9k/ath9k_common.ko \
            RedCherry-ZIP/modules/system/lib/modules/ath9k_common.ko

          cp kernel-artifact/ath9k/ath9k_hw.ko \
            RedCherry-ZIP/modules/system/lib/modules/ath9k_hw.ko

          cp kernel-artifact/ath9k/ath9k_htc.ko \
            RedCherry-ZIP/modules/system/lib/modules/ath9k_htc.ko

          echo "=== PACKAGE CONTENT ==="
          find RedCherry-ZIP -type f -print | sort

      - name: Create Package Preview
        run: |
          set -e

          cd RedCherry-ZIP
          zip -r9 ../RedCherry-miatoll-package-preview.zip .
          cd ..

          echo "=== FINAL ZIP CONTENT ==="
          unzip -l RedCherry-miatoll-package-preview.zip

      - name: Upload Package Preview
        uses: actions/upload-artifact@v4
        with:
          name: RedCherry-miatoll-package-preview
          path: RedCherry-miatoll-package-preview.zip
