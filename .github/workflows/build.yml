name: Build RedCherry Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential cpio flex \
            git libssl-dev libelf-dev \
            libncurses-dev python3 \
            unzip wget zip curl

      - name: Setup Clang
        run: |
          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang \
            clang

      - name: Setup GCC Cross Compiler
        run: |
          git clone --depth=1 \
            https://github.com/arter97/arm64-gcc \
            gcc64

      - name: Configure Kernel
        run: |
          make O=out \
            ARCH=arm64 \
            vendor/xiaomi/miatoll_defconfig

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KBUILD_BUILD_USER=Riaz \
            KBUILD_BUILD_HOST=RedCherry \
            Image

      - name: Check Output
        run: |
          find out/arch/arm64/boot -type f

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: RedCherry-Kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
