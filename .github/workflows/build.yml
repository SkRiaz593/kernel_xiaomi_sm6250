name: Build RedCherry Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            git \
            zip \
            cpio \
            curl \
            unzip \
            build-essential \
            python3

      - name: Setup Clang
        run: |
          mkdir -p clang
          cd clang

          curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip
          unzip master.zip

          cp -r proton-clang-master/* .

          echo "=== CLANG VERSION ==="
          ./bin/clang --version

      - name: Configure Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64

          make O=out ARCH=arm64 \
            vendor/xiaomi/miatoll_defconfig

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64

          export KBUILD_BUILD_USER=Riaz
          export KBUILD_BUILD_HOST=RedCherry

          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz

      - name: Check Output
        run: |
          echo "=== KERNEL OUTPUT ==="
          find out/arch/arm64/boot -type f

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: RedCherry-Test-Build
          path: out/arch/arm64/boot/Image.gz
